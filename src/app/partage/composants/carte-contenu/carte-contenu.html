
<a
  class="carte"
  [class.carte-accueil]="mode() === 'accueil'"
  [class.carte-catalogue]="mode() === 'catalogue'"
  [routerLink]="['/culture', contenu().categorieSlug, contenu().slug]"
  [attr.aria-label]="'Lire l’histoire : ' + contenu().titre"
>
  <div
    class="visuel"
    [class.sans-photo]="!contenu().image"
    [class.fond-gastronomie]="contenu().categorieSlug === 'gastronomie'"
    [class.fond-danses]="contenu().categorieSlug === 'danses'"
    [class.fond-musiques]="contenu().categorieSlug === 'musiques'"
    [class.fond-artisanat]="contenu().categorieSlug === 'artisanat'"
    [class.fond-contes]="contenu().categorieSlug === 'contes-et-legendes'"
    [class.fond-personnalites]="contenu().categorieSlug === 'personnalites'"
    [class.fond-fetes]="contenu().categorieSlug === 'fetes-et-ceremonies'"
  >
    @if (contenu().image) {
      <img
        [src]="contenu().image"
        [alt]="contenu().imageAlt || contenu().titre"
        loading="lazy"
      >
    }

    @if (categorie()) {
      <span class="badge-categorie">{{ categorie() }}</span>
    }
  </div>

  <div class="texte">
    <p class="meta">
      @if (region()) {
        {{ region() }}
      }

      @if (region() && contenu().tempsLecture) {
        <span aria-hidden="true"> · </span>
      }

      @if (contenu().tempsLecture) {
        {{ contenu().tempsLecture }} min de lecture
      }
    </p>

    <h3>{{ contenu().titre }}</h3>

    <p class="resume">{{ contenu().resume }}</p>

    <span class="lien">
      Lire l'histoire
      <i class="bi bi-arrow-right" aria-hidden="true"></i>
    </span>
  </div>
</a>
